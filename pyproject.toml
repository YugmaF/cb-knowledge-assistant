[project]
name = "kb-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant: LangGraph multi-agent RAG with RLM research, hybrid Pinecone retrieval, MCP tools, RBAC and guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langsmith>=0.3",
    "pinecone>=7.0",
    "fastembed>=0.5",
    "numpy>=1.26",
    "mcp>=1.9",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM108"]
